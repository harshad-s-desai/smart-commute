<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="auth-page-title">Login - Smart Commute</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome 6.4 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="/css/style.css">
    <style>
        :root {
            --auth-bg: #d8e2dc;
            --auth-circle: #cad8cf;
            --auth-card: #ffffff;
            --auth-primary: #275338;
            --auth-primary-hover: #1e402b;
            --auth-input-bg: #cbd5e1;
            --auth-input-border: #b0c0d0;
            --auth-heading: #1c3d28;
            --auth-text-muted: #56645a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--auth-bg);
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.25rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Subtle Organic Background Circles from Screenshot */
        .bg-circle {
            position: fixed;
            border-radius: 50%;
            background-color: var(--auth-circle);
            z-index: 0;
            pointer-events: none;
        }

        .bg-circle-1 {
            width: 440px;
            height: 440px;
            top: -120px;
            left: -120px;
            opacity: 0.85;
        }

        .bg-circle-2 {
            width: 520px;
            height: 520px;
            bottom: -150px;
            right: -150px;
            opacity: 0.85;
        }

        /* Top Home Navigation Pill */
        .auth-top-nav {
            position: fixed;
            top: 1.25rem;
            left: 1.5rem;
            z-index: 10;
        }

        .auth-back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            color: var(--auth-primary);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.2s ease;
        }

        .auth-back-link:hover {
            background: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(39, 83, 56, 0.12);
        }

        /* Centered Modal Card matching Reference Screenshots 1 & 4 */
        .auth-modal-card {
            width: 100%;
            max-width: 460px;
            background: var(--auth-card);
            border-radius: 28px;
            padding: 2.75rem 2.5rem 2.25rem 2.5rem;
            box-shadow: 0 20px 45px -10px rgba(28, 61, 40, 0.1), 0 0 1px 1px rgba(0, 0, 0, 0.03);
            position: relative;
            z-index: 2;
        }

        /* Top Centered Green Leaf Badge */
        .auth-icon-badge {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: #eaf2ec;
            color: var(--auth-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.35rem auto;
            font-size: 1.65rem;
            box-shadow: 0 4px 10px rgba(39, 83, 56, 0.08);
        }

        .auth-title {
            font-size: 1.85rem;
            font-weight: 800;
            color: var(--auth-heading);
            text-align: center;
            margin-bottom: 0.35rem;
            letter-spacing: -0.025em;
        }

        .auth-subtitle {
            font-size: 0.875rem;
            color: var(--auth-text-muted);
            text-align: center;
            margin-bottom: 1.85rem;
            line-height: 1.45;
        }

        /* Form Inputs matching Screenshot Slate Background style */
        .form-group {
            margin-bottom: 1.15rem;
            position: relative;
        }

        .form-label {
            display: block;
            font-size: 0.825rem;
            font-weight: 600;
            color: #2b3b30;
            margin-bottom: 0.35rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-input {
            width: 100%;
            padding: 0.85rem 1rem;
            font-size: 0.925rem;
            font-family: inherit;
            color: #1e293b;
            background-color: var(--auth-input-bg);
            border: 1px solid var(--auth-input-border);
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .form-input::placeholder {
            color: #64748b;
        }

        .form-input:focus {
            outline: none;
            background-color: #ffffff;
            border-color: var(--auth-primary);
            box-shadow: 0 0 0 3px rgba(39, 83, 56, 0.15);
        }

        .toggle-password {
            position: absolute;
            right: 0.85rem;
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 0.35rem;
            font-size: 0.95rem;
            transition: color 0.15s;
        }

        .toggle-password:hover {
            color: var(--auth-primary);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.85rem;
            margin-bottom: 1.15rem;
        }

        /* Gender selector */
        .gender-options {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.25rem;
        }

        .gender-radio-card {
            flex: 1;
            position: relative;
        }

        .gender-radio-card input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .gender-label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.65rem 0.4rem;
            border: 1px solid var(--auth-input-border);
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #334155;
            background-color: var(--auth-input-bg);
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .gender-radio-card input:checked + .gender-label {
            border-color: var(--auth-primary);
            background-color: #eaf2ec;
            color: var(--auth-primary);
        }

        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.35rem;
            font-size: 0.85rem;
        }

        .remember-wrapper {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            cursor: pointer;
            color: #475569;
            user-select: none;
        }

        .remember-wrapper input[type="checkbox"] {
            width: 0.95rem;
            height: 0.95rem;
            accent-color: var(--auth-primary);
            cursor: pointer;
            border-radius: 4px;
        }

        .forgot-link {
            color: var(--auth-primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.15s;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        /* Solid Dark Forest Green Submit Button */
        .btn-submit {
            width: 100%;
            padding: 0.88rem 1rem;
            font-size: 0.98rem;
            font-weight: 700;
            border-radius: 10px;
            background-color: var(--auth-primary);
            color: #ffffff;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(39, 83, 56, 0.22);
        }

        .btn-submit:hover {
            background-color: var(--auth-primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(39, 83, 56, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* Footer Link */
        .auth-footer-text {
            text-align: center;
            font-size: 0.875rem;
            color: #64748b;
            margin-top: 1.35rem;
        }

        .auth-footer-text a {
            color: var(--auth-primary);
            text-decoration: none;
            font-weight: 700;
            cursor: pointer;
            transition: color 0.15s;
        }

        .auth-footer-text a:hover {
            text-decoration: underline;
        }

        /* Quick Testing Demo Bar */
        .demo-bar {
            background: #f1f5f3;
            border-radius: 10px;
            padding: 0.65rem 0.85rem;
            margin-top: 1.35rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.78rem;
            border: 1px dashed #c4d4c8;
        }

        .demo-bar span {
            color: #56645a;
            font-weight: 600;
        }

        .demo-btn-group {
            display: flex;
            gap: 0.4rem;
        }

        .btn-demo {
            padding: 0.25rem 0.55rem;
            border-radius: 6px;
            font-size: 0.74rem;
            font-weight: 600;
            border: 1px solid #c4d4c8;
            background: #ffffff;
            cursor: pointer;
            color: #275338;
            transition: all 0.15s;
        }

        .btn-demo:hover {
            background: #eaf2ec;
        }

        /* Fade Animation */
        .fade-in {
            animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Toast Container */
        .toast-container {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            pointer-events: none;
        }

        .toast {
            min-width: 320px;
            max-width: 420px;
            background: #ffffff;
            border-radius: 10px;
            padding: 0.9rem 1.1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.9rem;
            color: #1e293b;
            opacity: 0;
            transform: translateX(30px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: auto;
            border-left: 4px solid var(--auth-primary);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(0);
        }

        .toast.hide {
            opacity: 0;
            transform: translateX(30px);
        }

        .toast-success { border-left-color: #15803d; }
        .toast-success i { color: #15803d; }

        .toast-error { border-left-color: #dc2626; }
        .toast-error i { color: #dc2626; }

        .toast-warning { border-left-color: #d97706; }
        .toast-warning i { color: #d97706; }

        .toast-info { border-left-color: var(--auth-primary); }
        .toast-info i { color: var(--auth-primary); }

        .toast-message {
            flex: 1;
            line-height: 1.4;
            font-weight: 500;
        }

        .toast-close {
            background: none;
            border: none;
            font-size: 1.2rem;
            line-height: 1;
            color: #94a3b8;
            cursor: pointer;
            padding: 0.2rem;
        }

        @media (max-width: 480px) {
            body {
                padding: 1rem 0.75rem;
            }
            .auth-modal-card {
                padding: 2rem 1.35rem;
                border-radius: 20px;
            }
            .form-row {
                grid-template-columns: 1fr;
                gap: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <!-- Subtle Organic Background Circles -->
    <div class="bg-circle bg-circle-1"></div>
    <div class="bg-circle bg-circle-2"></div>

    <!-- Home Link -->
    <div class="auth-top-nav">
        <a href="/" class="auth-back-link">
            <i class="fas fa-arrow-left"></i>
            <span>Back to SmartCommute</span>
        </a>
    </div>

    <!-- Main Auth Modal Card (Screenshots 1 & 4) -->
    <main class="auth-modal-card">
        <!-- Top Centered Leaf Icon Badge -->
        <div class="auth-icon-badge">
            <i class="fas fa-leaf"></i>
        </div>

        <!-- LOGIN VIEW -->
        <div id="login-view">
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Log in to continue your smart daily commutes.</p>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label class="form-label" for="loginEmail">Email</label>
                    <div class="input-wrapper">
                        <input type="email" id="loginEmail" class="form-input" placeholder="Enter your email" required autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="loginPassword">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="loginPassword" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
                        <button type="button" class="toggle-password" data-target="loginPassword" aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Specify Gender <span style="color: #dc2626;">*</span></label>
                    <div class="gender-options">
                        <label class="gender-radio-card">
                            <input type="radio" name="loginGender" value="male" id="loginGenderMale" required>
                            <span class="gender-label"><i class="fas fa-mars" style="color: #2563eb; margin-right: 4px;"></i> Male</span>
                        </label>
                        <label class="gender-radio-card">
                            <input type="radio" name="loginGender" value="female" id="loginGenderFemale" required>
                            <span class="gender-label"><i class="fas fa-venus" style="color: #ec4899; margin-right: 4px;"></i> Female</span>
                        </label>
                        <label class="gender-radio-card">
                            <input type="radio" name="loginGender" value="other" id="loginGenderOther" required>
                            <span class="gender-label"><i class="fas fa-genderless" style="color: #64748b; margin-right: 4px;"></i> Other</span>
                        </label>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-wrapper">
                        <input type="checkbox" id="rememberMe" checked>
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-link" onclick="window.AuthHelper?.showToast('Please contact admin or register a new account.', 'info'); return false;">Forgot Password?</a>
                </div>

                <button type="submit" id="loginSubmitBtn" class="btn-submit">
                    <span>Log In</span>
                </button>
            </form>

            <div class="auth-footer-text">
                Don't have an account? <a href="#signup" class="go-to-signup">Register</a>
            </div>

            <!-- Testing Demo Login Helper -->
            <div class="demo-bar">
                <span>Quick Logins:</span>
                <div class="demo-btn-group">
                    <button type="button" id="demoAdminBtn" class="btn-demo" style="background: #eaf2ec; font-weight: 700;" title="System Administrator">👑 Admin</button>
                    <button type="button" id="demoCommuterBtn" class="btn-demo" title="Harshad - Commuter">Commuter</button>
                    <button type="button" id="demoDriverBtn" class="btn-demo" title="Sneha - Driver">Driver</button>
                </div>
            </div>
        </div>

        <!-- CREATE ACCOUNT / SIGN UP VIEW (Screenshots 1 & 4) -->
        <div id="signup-view" style="display: none;">
            <h1 class="auth-title">Create Account</h1>
            <p class="auth-subtitle">Create your account and start managing your commutes.</p>

            <form id="signupForm" novalidate>
                <div class="form-group">
                    <label class="form-label" for="signupName">Full Name</label>
                    <div class="input-wrapper">
                        <input type="text" id="signupName" class="form-input" placeholder="Enter your full name" required autocomplete="name">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="signupEmail">Email</label>
                    <div class="input-wrapper">
                        <input type="email" id="signupEmail" class="form-input" placeholder="ms@gmail.com" required autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="signupMobile">Mobile Number <span style="color: #dc2626;">*</span></label>
                    <div class="input-wrapper">
                        <input type="tel" id="signupMobile" class="form-input" placeholder="e.g. 9822012345" required autocomplete="tel" pattern="[0-9]{10}">
                    </div>
                    <small style="color: var(--text-muted); font-size: 0.78rem; margin-top: 4px; display: block;">
                        <i class="fas fa-phone-alt" style="color: #15803d;"></i> Shared with co-commuters for pickup coordination.
                    </small>
                </div>

                <div class="form-group">
                    <label class="form-label">Specify Gender <span style="color: #dc2626;">*</span></label>
                    <div class="gender-options">
                        <label class="gender-radio-card">
                            <input type="radio" name="signupGender" value="male" id="signupGenderMale" required>
                            <span class="gender-label"><i class="fas fa-mars" style="color: #2563eb; margin-right: 4px;"></i> Male</span>
                        </label>
                        <label class="gender-radio-card">
                            <input type="radio" name="signupGender" value="female" id="signupGenderFemale" required>
                            <span class="gender-label"><i class="fas fa-venus" style="color: #ec4899; margin-right: 4px;"></i> Female</span>
                        </label>
                        <label class="gender-radio-card">
                            <input type="radio" name="signupGender" value="other" id="signupGenderOther" required>
                            <span class="gender-label"><i class="fas fa-genderless" style="color: #64748b; margin-right: 4px;"></i> Other</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="signupPassword">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="signupPassword" class="form-input" placeholder="Enter your password" required autocomplete="new-password">
                        <button type="button" class="toggle-password" data-target="signupPassword" aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="signupConfirmPassword">Confirm Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="signupConfirmPassword" class="form-input" placeholder="Confirm your password" required autocomplete="new-password">
                        <button type="button" class="toggle-password" data-target="signupConfirmPassword" aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="signupSubmitBtn" class="btn-submit" style="margin-top: 1.5rem;">
                    <span>Register</span>
                </button>
            </form>

            <div class="auth-footer-text">
                Already have an account? <a href="#login" class="go-to-login">Login</a>
            </div>
        </div>
    </main>

    <!-- Global Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Scripts -->
    <script src="/js/app.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
